<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KINETIC · Athlete OS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121212;--card:#1E1E1E;--card2:#252525;--card3:#2C2C2C;
  --border:#2A2A2A;--border2:#383838;
  --accent:#E63939;--accent-d:#c02e2e;
  --green:#34C759;--blue:#0A84FF;--orange:#FF9500;--violet:#BF5AF2;--gold:#FFD60A;
  --t1:#F5F5F5;--t2:#AAAAAA;--t3:#666666;
  --f:'Inter',-apple-system,sans-serif;--r:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t1);font-family:var(--f);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:90px;overflow-x:hidden;-webkit-font-smoothing:antialiased}

.hero{padding:52px 20px 20px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-60px;right:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(230,57,57,.06),transparent 70%);pointer-events:none}
.hero-label{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero-title{font-size:clamp(28px,8vw,48px);font-weight:700;line-height:1.05;letter-spacing:-.5px}
.hero-title strong{color:var(--accent)}
.hero-meta{font-size:13px;color:var(--t2);margin-top:8px;line-height:1.6}

.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,18,18,.97);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;z-index:200;padding:8px 2px 16px}
.nb{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;opacity:.35;transition:opacity .2s;color:var(--t2)}
.nb.active{opacity:1;color:var(--accent)}
.ni{font-size:20px;line-height:1}
.nl{font-size:8px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}

.page{display:none;padding:0 16px}
.page.active{display:block}

.sh{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sh::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px;flex-shrink:0}
.sh-t{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}

.c{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;border:1px solid var(--border)}

.btn{display:block;width:100%;padding:14px;border-radius:12px;font-family:var(--f);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-align:center}
.bp{background:var(--accent);color:#fff}
.bp:active{background:var(--accent-d);transform:scale(.98)}
.bo{background:transparent;border:1.5px solid var(--border2);color:var(--t1)}
.bg2{background:var(--card2);color:var(--t1);border:1px solid var(--border)}

.wk{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.wk-h{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer}
.wk-c{color:var(--t3);font-size:11px;transition:transform .22s}
.wk.open .wk-c{transform:rotate(180deg)}
.wk-b{display:none;border-top:1px solid var(--border);padding:12px 16px}
.wk-b.open{display:block}

.er{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);gap:8px}
.er:last-of-type{border-bottom:none}

.abort-btn{
  background:var(--card2)!important;
  border:1.5px solid var(--border)!important;
  color:var(--t3)!important;
  padding:6px 12px!important;
  border-radius:8px!important;
  font-size:12px!important;
  cursor:pointer!important;
  z-index:200!important;
  pointer-events:auto!important;
  position:relative!important;
}
.abort-btn:active{background:var(--accent)!important;color:#fff!important}

/* Weitere Styles (verkürzt) */
#ws-pill-row{overflow-x:auto;white-space:nowrap;padding:4px 0;z-index:80}
.sticky-top{position:sticky;top:0;background:var(--bg);z-index:100;padding:12px 0;border-bottom:1px solid var(--border)}
</style>
</head>
<body>

<div class="autosave-bar" id="autosave-bar" style="position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),var(--blue));transform:scaleX(0);transform-origin:left;transition:transform .5s ease;z-index:400;pointer-events:none"></div>

<!-- HERO -->
<div class="hero" id="hero-section">
  <div class="hero-label">⚡ KINETIC · Athlete OS</div>
  <div class="hero-title">Dein Körper.<br><strong>Dein Plan.</strong></div>
  <div class="hero-meta">190 cm · <span id="hero-weight">108</span> kg · KFA 20,1% · FFMI 26,6<br>Woche 1 / 6 · 🔥 <span id="hero-streak">0</span> Tage Streak</div>
</div>

<!-- DASHBOARD -->
<div class="page active" id="page-dash"> ... Dashboard Inhalt ... </div>

<!-- PLAN -->
<div class="page" id="page-plan">
  <div class="sh"><span class="sh-t">Wochenplan</span></div>
  <div id="plan-content">Lade Plan...</div>
</div>

<!-- LOG -->
<div class="page" id="page-log">
  <div id="ws-no-session">
    <p>Kein Training aktiv. Gehe zum Plan und starte ein Workout.</p>
  </div>

  <div id="ws-active-session" style="display:none">
    <div class="sticky-top">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div id="ws-session-label" style="font-weight:700">WORKOUT</div>
          <div>⏱ <span id="ws-elapsed">00:00</span></div>
        </div>
        <button onclick="confirmDiscardWorkout()" class="abort-btn">✕ Abbruch</button>
      </div>
      <div id="ws-pill-row"></div>
    </div>

    <div style="padding:16px">
      <div class="c">
        <div id="ws-ex-group" style="color:var(--t3);font-size:13px"></div>
        <div id="ws-ex-name" style="font-size:22px;font-weight:700"></div>
        <div id="ws-ex-target" style="color:var(--t2)"></div>
      </div>

      <div class="c" id="ws-sets-container"></div>

      <div style="display:flex;gap:8px;margin-top:16px">
        <button id="ws-prev-btn" onclick="wsPrevEx()" class="btn bo" style="flex:0 0 60px">‹</button>
        <button id="ws-next-btn" onclick="wsNextOrFinish()" class="btn bp">Nächste Übung →</button>
      </div>
    </div>
  </div>
</div>

<!-- Weitere Pages (ern, game, ai, data, mob) können bei Bedarf erweitert werden -->

<nav class="nav">
  <button class="nb active" onclick="sp('dash')" id="nav-dash"><span class="ni">📊</span><span class="nl">Dashboard</span></button>
  <button class="nb" onclick="sp('plan')" id="nav-plan"><span class="ni">📅</span><span class="nl">Plan</span></button>
  <button class="nb" onclick="sp('log')" id="nav-log"><span class="ni">✏️</span><span class="nl">Loggen</span></button>
  <button class="nb" onclick="sp('game')" id="nav-game"><span class="ni">🏆</span><span class="nl">XP</span></button>
  <button class="nb" onclick="sp('ern')" id="nav-ern"><span class="ni">🥗</span><span class="nl">Essen</span></button>
</nav>

<script>
// ====================== KERN ======================
const DB = {
  get(k) {
    try { return JSON.parse(localStorage.getItem('kinetic_'+k)); } catch(e){ return null; }
  },
  set(k, v) {
    try {
      localStorage.setItem('kinetic_'+k, JSON.stringify(v));
      flashSaveBar();
    } catch(e){ console.error(e); }
  }
};

let activeSession = null;
let wsElapsedSecs = 0;
let wsElapsedTimer = null;

// Seiten wechseln
function sp(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+page).classList.add('active');
}

// Abbruch-Funktion (fix)
function confirmDiscardWorkout() {
  if (!activeSession) return;
  if (confirm("Training wirklich abbrechen? Fortschritt geht verloren.")) {
    clearInterval(wsElapsedTimer);
    activeSession = null;
    DB.set('activeWS', null);
    sp('plan');
  }
}

// Workout starten
function openLog(day, firstEx) {
  activeSession = {
    dayKey: day,
    sessionName: "Push / Pull / Legs",
    startTime: Date.now(),
    exercises: [{name: firstEx || "Bankdrücken (LH)", sets: "4×6-8"}],
    currentExIdx: 0,
    logs: {}
  };
  DB.set('activeWS', activeSession);
  
  wsElapsedSecs = 0;
  clearInterval(wsElapsedTimer);
  wsElapsedTimer = setInterval(() => {
    wsElapsedSecs++;
    const m = Math.floor(wsElapsedSecs/60).toString().padStart(2,'0');
    const s = (wsElapsedSecs%60).toString().padStart(2,'0');
    document.getElementById('ws-elapsed').textContent = `${m}:${s}`;
  }, 1000);

  sp('log');
  document.getElementById('ws-no-session').style.display = 'none';
  document.getElementById('ws-active-session').style.display = 'block';
  renderWSExercise();
}

function renderWSExercise() {
  if (!activeSession) return;
  const ex = activeSession.exercises[activeSession.currentExIdx];
  
  document.getElementById('ws-ex-name').textContent = ex.name;
  document.getElementById('ws-ex-target').textContent = ex.sets;
}

// Toast
function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--accent);color:var(--t1);padding:12px 20px;border-radius:12px;z-index:999;white-space:nowrap;`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function flashSaveBar() {
  const bar = document.getElementById('autosave-bar');
  bar.style.transform = 'scaleX(1)';
  setTimeout(() => bar.style.transform = 'scaleX(0)', 700);
}

// Init
window.onload = () => {
  // Versuch aktive Session wiederherzustellen
  activeSession = DB.get('activeWS');
  if (activeSession) {
    sp('log');
    document.getElementById('ws-no-session').style.display = 'none';
    document.getElementById('ws-active-session').style.display = 'block';
    renderWSExercise();
  }
  
  showToast("✅ App geladen – Abbruch-Button sollte jetzt funktionieren");
};
</script>
</body>
</html>
