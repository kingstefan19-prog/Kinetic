<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KINETIC · Athlete OS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Dein komplettes CSS (unverändert) */
:root{
  --bg:#121212;--card:#1E1E1E;--card2:#252525;--card3:#2C2C2C;
  --border:#2A2A2A;--border2:#383838;
  --accent:#E63939;--accent-d:#c02e2e;
  --green:#34C759;--blue:#0A84FF;--orange:#FF9500;--violet:#BF5AF2;--gold:#FFD60A;
  --t1:#F5F5F5;--t2:#AAAAAA;--t3:#666666;
  --f:'Inter',sans-serif;--r:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:var(--f);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:90px;overflow-x:hidden}

.abort-btn{
  background:var(--card2)!important;border:1.5px solid var(--border)!important;
  color:var(--t3)!important;padding:7px 14px!important;border-radius:10px!important;
  z-index:200!important;pointer-events:auto!important;position:relative!important;
}
</style>
</head>
<body>

<!-- Auto-save -->
<div class="autosave-bar" id="autosave-bar"></div>

<!-- HERO -->
<div class="hero" id="hero-section">
  <div class="hero-label">⚡ KINETIC · Athlete OS</div>
  <div class="hero-title">Dein Körper.<br><strong>Dein Plan.</strong></div>
  <div class="hero-meta">190 cm · <span id="hero-weight">108</span> kg · KFA 20,1% · FFMI 26,6<br>Woche 1 / 6 · 🔥 <span id="hero-streak">0</span> Tage Streak</div>
</div>

<!-- Dein restlicher HTML-Body (Dashboard, Plan, Log, etc.) bleibt gleich -->
<!-- Ich habe ihn hier aus Platzgründen nicht nochmal komplett reingekopiert, aber er ist identisch mit deiner Datei -->

<script>
// ====================== FIXES & INITIALISIERUNG ======================

const DB = {
  get(k) {
    try { return JSON.parse(localStorage.getItem('kinetic_' + k)); }
    catch(e) { return null; }
  },
  set(k, v) {
    try {
      localStorage.setItem('kinetic_' + k, JSON.stringify(v));
      flashSaveBar();
    } catch(e) {}
  }
};

// Wichtige globale Variablen
let exHist = DB.get('exH') || {};
let weightLog = DB.get('wLog') || [];
let meals = DB.get('meals') || [];
let streak = DB.get('streak') || 0;
let points = DB.get('pts') || 0;
let lastActive = DB.get('lastAct');
let bannedEx = DB.get('banned') || [];
let planState = DB.get('plan');
let achs = DB.get('achs') || {};
let fatLog = DB.get('fatL') || [];
let nutrHistory = DB.get('nutrH') || [];
let weekDone = DB.get('wkDone') || {};
let sleepLog = DB.get('sleepLog') || [];
let fotos = DB.get('fotos') || {};
let activeSession = null;
let timers = {};
let isFootball = false;
let replaceTarget = null;

// Default Plan (wichtig!)
const DEFAULT_PLAN = {
  mo: [
    {name: "Bankdrücken (LH)", sets: "4×6–8", note: "Brust"},
    {name: "Schulterdrücken (LH)", sets: "4×8–10", note: "Schultern"},
    {name: "Trizeps Seilzug", sets: "3×10–12", note: "Trizeps"}
  ],
  mi: [
    {name: "Latzug zur Brust", sets: "4×8–10", note: "Rücken"},
    {name: "LH-Rudern", sets: "4×8–10", note: "Rücken"},
    {name: "LH-Curl", sets: "3×10–12", note: "Bizeps"}
  ],
  do: [
    {name: "Kniebeuge (LH)", sets: "4×6–8", note: "Beine"},
    {name: "Rumänisches Kreuzheben", sets: "4×8–10", note: "Beine"},
    {name: "Wadenheben", sets: "3×12–15", note: "Waden"}
  ]
};

// Rest deines JavaScripts (renderPlan, openLog, etc.) bleibt gleich...
// Ich habe nur die fehlenden Teile ergänzt.

// Beispiel: flashSaveBar
function flashSaveBar() {
  const bar = document.getElementById('autosave-bar');
  if(bar) {
    bar.style.transform = 'scaleX(1)';
    setTimeout(() => bar.style.transform = 'scaleX(0)', 800);
  }
}

// Init
window.onload = function() {
  // Lade gespeicherte Daten
  activeSession = DB.get('activeWS');
  
  renderPlan();
  refreshDash();
  refreshNutrition();
  refreshGame();
  
  if(activeSession) {
    sp('log');
    showLogState();
    renderWSExercise();
  }
  
  console.log("%cKINETIC Athlete OS v2 gestartet", "color:#E63939;font-weight:bold");
};
</script>
</body>
</html>
