<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KINETIC · Athlete OS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Dein komplettes CSS bleibt unverändert */
:root{
  --bg:#121212;--card:#1E1E1E;--card2:#252525;--card3:#2C2C2C;
  --border:#2A2A2A;--border2:#383838;
  --accent:#E63939;--accent-d:#c02e2e;
  --green:#34C759;--blue:#0A84FF;--orange:#FF9500;--violet:#BF5AF2;--gold:#FFD60A;
  --t1:#F5F5F5;--t2:#AAAAAA;--t3:#666666;
  --f:'Inter',-apple-system,sans-serif;--r:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t1);font-family:var(--f);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:90px;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* FIX: Abbruch-Button deutlich sichtbar und klickbar machen */
.abort-btn, button[onclick*="confirmDiscardWorkout"] {
  background:var(--card2)!important;
  border:2px solid var(--accent)!important;
  color:var(--t1)!important;
  padding:8px 16px!important;
  border-radius:10px!important;
  font-weight:600!important;
  z-index:300!important;
  pointer-events:auto!important;
  position:relative!important;
}
.abort-btn:active {background:var(--accent)!important; color:#fff!important;}
</style>
</head>
<body>

<!-- Auto-save indicator bar -->
<div class="autosave-bar" id="autosave-bar"></div>

<!-- Dein gesamter HTML-Body (Hero, Pages, Modals, Nav) bleibt exakt gleich -->
<!-- ... (alles von <div class="hero"> bis zum Ende von </nav>) ... -->

<!-- Hier nur der verbesserte Script-Bereich -->

<script>
// ====================== KORREKTUREN ======================

const DB = {
  get(k) {
    try { return JSON.parse(localStorage.getItem('kinetic_' + k)); } 
    catch(e) { return null; }
  },
  set(k, v) {
    try {
      localStorage.setItem('kinetic_' + k, JSON.stringify(v));
      flashSaveBar();
    } catch(e) { console.error(e); }
  }
};

// Wichtige globale Variablen
let activeSession = null;
let wsElapsedSecs = 0;
let wsElapsedTimer = null;
let wsRestTimer = null;
let wsRestRemaining = 0;
let wsSuggestionData = null;

// Abbruch-Funktion (fix)
function confirmDiscardWorkout() {
  if (!activeSession) { sp('plan'); return; }
  if (confirm('Training wirklich abbrechen? Alle Eingaben gehen verloren.')) {
    clearInterval(wsElapsedTimer);
    stopRestTimer();
    DB.set('activeWS', null);
    activeSession = null;
    sp('plan');
  }
}

// Flash Save Bar
function flashSaveBar() {
  const bar = document.getElementById('autosave-bar');
  if (!bar) return;
  bar.style.transform = 'scaleX(1)';
  setTimeout(() => bar.style.transform = 'scaleX(0)', 700);
}

// Seitenwechsel
function sp(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pageEl = document.getElementById('page-' + name);
  if (pageEl) pageEl.classList.add('active');

  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  const navEl = document.getElementById('nav-' + name);
  if (navEl) navEl.classList.add('active');

  if (name === 'dash') refreshDash();
  if (name === 'plan') if(typeof renderPlan === 'function') renderPlan();
}

// INIT
window.onload = function() {
  // Versuche aktive Session wiederherzustellen
  activeSession = DB.get('activeWS');

  // Grundfunktionen starten
  if (typeof renderPlan === 'function') renderPlan();
  if (typeof refreshDash === 'function') refreshDash();
  if (typeof refreshNutrition === 'function') refreshNutrition();

  if (activeSession) {
    sp('log');
    if (typeof showLogState === 'function') showLogState();
    if (typeof renderWSExercise === 'function') renderWSExercise();
  }

  console.log('%c✅ KINETIC App gestartet – Abbruch-Button korrigiert', 'color:#34C759;font-weight:bold');
};
</script>
</body>
</html>
